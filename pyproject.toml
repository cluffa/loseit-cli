[project]
name = "loseit-cli"
version = "0.1.0"
description = "Agent-first CLI for LoseIt.com calorie tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "browser-cookie3>=0.19",
    "playwright>=1.45",
]

[project.scripts]
loseit = "loseit.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loseit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
